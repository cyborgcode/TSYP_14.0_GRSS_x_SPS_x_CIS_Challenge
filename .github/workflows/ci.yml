name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  groundlink:
    name: Ground-link pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,twin]"

      - name: Lint
        run: ruff check groundlink testbed digital_twin tests

      - name: Format check
        run: ruff format --check groundlink testbed digital_twin tests

      - name: Test
        run: python -m pytest

      - name: Standard scenario
        run: python -m groundlink.cli

      # The twin flies TerraSAR-X's live orbit from CelesTrak's public GP service. An
      # outage there only sends the twin to its offline fallback, so it does not fail CI.
      - name: Live orbit from CelesTrak
        continue-on-error: true
        run: python -m digital_twin.ephemeris_loader --require-live

      - name: Digital twin red-team report
        run: python -m digital_twin.physics_validator

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

