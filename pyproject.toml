[project]
name = "groundlink"
version = "0.2.0"
description = "Track 1 — Secure Ground-Link Testbed: authenticated satellite-to-station framing plus link anomaly detection."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
higgsfield = ["higgsfield-client>=0.2", "python-dotenv>=1.0"]

[project.scripts]
groundlink = "groundlink.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["groundlink*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
